name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core-linux:
    name: Core + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PhotosWindows.Core.slnf
      - name: Build (Release, warnings as errors)
        run: dotnet build PhotosWindows.Core.slnf -c Release --no-restore
      - name: Test
        run: dotnet test PhotosWindows.Core.slnf -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore

  windows-tests:
    name: Core + tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PhotosWindows.Core.slnf
      - name: Build core (Release)
        run: dotnet build PhotosWindows.Core.slnf -c Release --no-restore
      - name: Test
        run: dotnet test PhotosWindows.Core.slnf -c Release --no-build --logger "trx" --results-directory TestResults --blame-hang-timeout 5m
      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            [xml]$x = Get-Content $f.FullName
            $c = $x.TestRun.ResultSummary.Counters
            "| $($f.Name) | total $($c.total) | passed $($c.passed) | failed $($c.failed) |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore

  windows-app:
    name: Windows app (WinUI 3, x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build app (Release, x64)
        run: dotnet build src/PhotosWindows.App/PhotosWindows.App.csproj -c Release -p:Platform=x64
      - name: Publish app (self-contained folder)
        run: dotnet publish src/PhotosWindows.App/PhotosWindows.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/PhotosWindows-win-x64
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotosWindows-win-x64
          path: artifacts/PhotosWindows-win-x64
          if-no-files-found: error
      - name: Vulnerable package report
        shell: pwsh
        run: |
          dotnet list PhotosWindows.sln package --vulnerable --include-transitive | Tee-Object -FilePath vulnerable.txt
          if (Select-String -Path vulnerable.txt -Pattern "has the following vulnerable packages") { Write-Error "Vulnerable packages found"; exit 1 }
