
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ==========================================
  # CORE + TESTS (LINUX)
  # ==========================================
  core-linux:
    name: Core + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhotosWindows.Core.slnf

      - name: Build (Release, warnings as errors)
        run: dotnet build PhotosWindows.Core.slnf -c Release --no-restore

      - name: Cache test assets (face models, public-domain test photos)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pw-test-assets
          key: pw-test-assets-${{ hashFiles('src/PhotosWindows.MachineLearning/FaceModelCatalog.cs', 'tests/PhotosWindows.Integration.Tests/Support/RealModelAssets.cs') }}

      - name: Test
        env:
          PW_TEST_ASSETS: ${{ runner.temp }}/pw-test-assets
        run: dotnet test PhotosWindows.Core.slnf -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore
          retention-days: 2

  # ==========================================
  # CORE + TESTS (WINDOWS)
  # ==========================================
  windows-tests:
    name: Core + tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhotosWindows.Core.slnf

      - name: Build core (Release)
        run: dotnet build PhotosWindows.Core.slnf -c Release --no-restore

      - name: Cache test assets (face models, public-domain test photos)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pw-test-assets
          key: pw-test-assets-${{ hashFiles('src/PhotosWindows.MachineLearning/FaceModelCatalog.cs', 'tests/PhotosWindows.Integration.Tests/Support/RealModelAssets.cs') }}

      - name: Test
        env:
          PW_TEST_ASSETS: ${{ runner.temp }}/pw-test-assets
        run: dotnet test PhotosWindows.Core.slnf -c Release --no-build --logger "trx" --results-directory TestResults --blame-hang-timeout 5m

      # Fixed: TRX filenames may contain brackets [1].
      # Use -LiteralPath to prevent wildcard interpretation.
      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue

          if (-not $files) {
            "No TRX test results found." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "| Test file | Total | Passed | Failed | Not executed (blocked) |" >> $env:GITHUB_STEP_SUMMARY
            "|---|---:|---:|---:|---:|" >> $env:GITHUB_STEP_SUMMARY

            foreach ($f in $files) {
              [xml]$x = Get-Content -LiteralPath $f.FullName -Raw
              $c = $x.TestRun.ResultSummary.Counters

              "| $($f.Name) | $($c.total) | $($c.passed) | $($c.failed) | $($c.notExecuted) |" >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore
          retention-days: 2

  # ==========================================
  # WINDOWS APP (WINUI 3, X64)
  # ==========================================
  windows-app:
    name: Windows app (WinUI 3, x64)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build app (Release, x64)
        run: dotnet build src/PhotosWindows.App/PhotosWindows.App.csproj -c Release -p:Platform=x64

      - name: Publish app (self-contained folder)
        run: dotnet publish src/PhotosWindows.App/PhotosWindows.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/PhotosWindows-win-x64

      - name: Smoke test the published app (must start and stay alive)
        shell: pwsh
        run: |
          # Regression check: published folder must
          # contain resources.pri/.xbf and app must start.
          ./tests/PhotosWindows.UIAutomation.Tests/scripts/startup-smoke.ps1 -Exe artifacts/PhotosWindows-win-x64/PhotosWindows.exe -Output artifacts/smoke

          if (-not (Select-String -Path artifacts/smoke/startup-smoke.txt -Pattern 'RESULT: alive' -Quiet)) {
            Write-Error "The published app did not stay running."
            exit 1
          }

      # Store the executable only on:
      # - Push to the default branch
      # - Manual workflow execution
      #
      # Avoids accumulating large build artifacts
      # during development.

      - name: Upload app artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: PhotosWindows-win-x64
          path: artifacts/PhotosWindows-win-x64
          if-no-files-found: error
          retention-days: 2

      # ==========================================
      # SECURITY CHECK
      # ==========================================
      - name: Vulnerable package report
        shell: pwsh
        run: |
          dotnet list PhotosWindows.sln package --vulnerable --include-transitive | Tee-Object -FilePath vulnerable.txt

          if (Select-String -Path vulnerable.txt -Pattern "has the following vulnerable packages") {
            Write-Error "Vulnerable packages found"
            exit 1
          }
